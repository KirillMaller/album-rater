# ============================================================================
#  Злобные карты — конфиг для nginx.
#
#  Нужен, только если на сервере на портах 80/443 уже сидит nginx.
#  Если там Caddy — бери deploy/Caddyfile.example, он проще.
#
#  ЗАМЕНИ 109.172.94.130 на реальный IP сервера — везде в этом файле.
#  Узнать IP:  curl -s https://api.ipify.org   или   bash deploy/check-server.sh
#  Домен игры собирается из IP: <IP-сервера>.sslip.io. sslip.io это авто-DNS:
#  имя резолвится обратно в тот же IP, регистрировать домен не нужно,
#  сертификат Let's Encrypt на него выдаётся как на обычный.
#
#  Замен ровно две:
#    1) 109.172.94.130 в этом файле (несколько вхождений — правь через sed, см. ниже)
#    2) PUBLIC_URL=https://109-172-94-130.sslip.io в .env проекта
#
#  ВНИМАНИЕ: на сервере уже работают сайт, бот и VPN. Чужие конфиги в
#  /etc/nginx/sites-enabled НЕ ТРОГАЕМ — только добавляем этот отдельный файл.
# ============================================================================


# ----------------------------------------------------------------------------
#  ШАГ 1. map для WebSocket — ОБЯЗАТЕЛЕН, без него Socket.io не работает.
#
#  map живёт в http-контексте. sites-enabled/* подключается именно из http {},
#  поэтому строки ниже спокойно живут прямо здесь, отдельный файл не нужен.
#
#  Переменная названа $evil_cards_conn_upgrade, а не общепринятой
#  $connection_upgrade, СПЕЦИАЛЬНО: на этом сервере уже есть чужие конфиги
#  (beszel, cedar-sub), и они вполне могли объявить $connection_upgrade сами.
#  Тогда nginx -t упал бы с "duplicate ... $connection_upgrade" и чинить
#  пришлось бы в чужом файле. С уникальным именем столкновения не будет.
# ----------------------------------------------------------------------------
map $http_upgrade $evil_cards_conn_upgrade {
    default upgrade;   # запрос на апгрейд до WebSocket — пробрасываем
    ''      close;     # обычный HTTP — соединение закрываем как всегда
}

# Апстрим — контейнер игры, доступный только с localhost.
upstream evil_cards_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}


# ----------------------------------------------------------------------------
#  ШАГ 2. HTTP :80 — редирект на HTTPS + место для проверки certbot.
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 109-172-94-130.sslip.io;

    # Проверка владения доменом для Let's Encrypt (webroot-режим).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ----------------------------------------------------------------------------
#  ШАГ 3. HTTPS :443 — сама игра.
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 109-172-94-130.sslip.io;

    # HTTP/2 намеренно НЕ включён.
    #   - На Ubuntu 22.04 штатный nginx 1.18, и отдельной директивы `http2 on;`
    #     там ещё нет: nginx -t упадёт с "unknown directive". Для 1.18 синтаксис
    #     другой — параметр listen: `listen 443 ssl http2;`.
    #   - Игре HTTP/2 не нужен: весь обмен идёт по WebSocket, а он и так один
    #     постоянный коннект.
    # Хочешь включить — сначала посмотри версию (`nginx -v`) и возьми свой вариант:
    #   nginx < 1.25.1 :  listen 443 ssl http2;   (вместо строки listen выше)
    #   nginx >= 1.25.1:  http2 on;

    # --- Сертификат ---------------------------------------------------------
    # Эти пути создаст certbot (команда — в конце файла).
    # Пока сертификата нет, nginx с этим блоком НЕ ЗАПУСТИТСЯ: сначала
    # включи только блок :80, получи сертификат, потом включай :443.
    ssl_certificate     /etc/letsencrypt/live/109-172-94-130.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/109-172-94-130.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EvilCardsSSL:5m;
    ssl_session_timeout 1d;

    # Логи отдельным файлом, чтобы не мешались с логами сайта.
    access_log /var/log/nginx/evil-cards.access.log;
    error_log  /var/log/nginx/evil-cards.error.log;

    # Гость вставляет свои карты текстом — с запасом.
    client_max_body_size 2m;

    # --- Прокси на игру -----------------------------------------------------
    location / {
        proxy_pass http://evil_cards_backend;

        # >>> WEBSOCKET. Три строки ниже — самое важное во всём файле. <<<
        # Без них страница откроется, но игроки не подключатся: Socket.io
        # не сможет перейти с HTTP на WebSocket, и телефоны будут вечно
        # висеть на «подключение…».
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $evil_cards_conn_upgrade;

        # Кто пришёл и по какому протоколу.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Таймауты. Партия идёт полтора часа, игрок может держать сокет
        # открытым всё это время. По умолчанию nginx рвёт соединение через
        # 60 секунд тишины — и игроки вылетают посреди раунда.
        proxy_read_timeout    7d;
        proxy_send_timeout    7d;
        proxy_connect_timeout 10s;

        # Буферизацию выключаем: события игры должны уходить на телефон
        # мгновенно, а не копиться в буфере nginx.
        proxy_buffering off;
        proxy_cache off;

        # Долгие соединения не должны падать при перезагрузке конфига.
        proxy_socket_keepalive on;
    }

    # Healthcheck: пусть не засоряет access-лог.
    location = /health {
        proxy_pass http://evil_cards_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}


# ============================================================================
#  КАК ПОСТАВИТЬ, НЕ СЛОМАВ УЖЕ РАБОТАЮЩИЙ САЙТ
# ============================================================================
#
#  0) Бэкап конфигов (2 секунды):
#       sudo tar czf /root/nginx-backup-$(date +%F).tar.gz /etc/nginx
#
#  1) Скопировать файл и подставить IP. ЕДИНСТВЕННОЕ место, где его вписываешь
#     руками (адрес в конфиге уже подставлен — 109-172-94-130.sslip.io):
#       sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/evil-cards.conf
#       sudo sed -i "s/109.172.94.130/$SERVER_IP/g" /etc/nginx/sites-available/evil-cards.conf
#
#  2) ВРЕМЕННО закомментировать весь блок `server { listen 443 ... }`
#     (сертификата ещё нет — nginx не стартует со ссылкой на несуществующий файл).
#
#  3) Включить сайт и проверить конфиг:
#       sudo ln -s /etc/nginx/sites-available/evil-cards.conf /etc/nginx/sites-enabled/
#       sudo nginx -t
#       sudo systemctl reload nginx        # reload, НЕ restart — сайт не моргнёт
#
#  4) Получить сертификат для sslip.io-домена — ТОЛЬКО режимом webroot.
#
#     >>> `certbot --nginx` НА ЭТОМ СЕРВЕРЕ НЕ ЗАПУСКАТЬ. <<<
#     Плагин --nginx переписывает конфигурацию nginx: он лезет в файлы чужих
#     сайтов (beszel, cedar-sub на 8443/8444), может добавить туда свои строки
#     и перезапустить nginx. Здесь живут личные сервисы владельца, ронять их
#     нельзя. webroot трогает только каталог с проверочным файлом.
#
#       sudo mkdir -p /var/www/html/.well-known/acme-challenge
#       sudo certbot certonly --webroot -w /var/www/html \
#            -d "109-172-94-130.sslip.io" --agree-tos -m <почта> -n
#
#     Если certbot не установлен — ставим БЕЗ плагина для nginx:
#       sudo apt update && sudo apt install -y certbot
#     (пакет python3-certbot-nginx не нужен и как раз тянет тот самый плагин).
#
#     Перед выпуском проверь три вещи:
#       ufw status | grep -E '80|443'        # порты открыты? см. deploy/README.md
#       dig +short "109-172-94-130.sslip.io" # резолвится в этот сервер?
#       curl -I http://109-172-94-130.sslip.io/.well-known/acme-challenge/  # 403/404 ок, таймаут — нет
#
#  5) Раскомментировать блок :443 и применить:
#       sudo nginx -t && sudo systemctl reload nginx
#
#  6) Проверить:
#       curl -I "https://109-172-94-130.sslip.io/health"
#
#  Автопродление certbot ставит сам (systemd-таймер). Проверить:
#       systemctl list-timers | grep certbot
#       sudo certbot renew --dry-run
#
#  Откат: sudo rm /etc/nginx/sites-enabled/evil-cards.conf && sudo systemctl reload nginx
#  Всё остальное на сервере при этом продолжает работать как работало.
