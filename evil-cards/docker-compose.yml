# ============================================================================
#  Злобные карты — запуск на VPS (Aeza, Германия).
#
#  На этом сервере УЖЕ живут сайт, Telegram-бот и VPN. Игра не должна их
#  подвинуть, поэтому здесь жёсткие рамки: 256 МБ памяти, половина ядра,
#  ограниченные логи и порт наружу НЕ торчит — только через reverse-proxy.
#
#  Запуск:   docker compose up -d
#  Логи:     docker compose logs -f
#  Стоп:     docker compose down
#  Память:   docker stats evil-cards
# ============================================================================

services:
  evil-cards:
    build: .
    image: evil-cards:latest
    container_name: evil-cards
    restart: unless-stopped

    # init: true — внутрь подставляется маленький init-процесс (PID 1),
    # он хоронит зомби-процессы и корректно передаёт SIGTERM в node.
    # Именно поэтому в Dockerfile не нужен dumb-init/tini отдельным пакетом.
    init: true

    # PORT и PUBLIC_URL берём из .env рядом с этим файлом (см. .env.example).
    # Файл .env должен существовать — его создаёт deploy/deploy.sh.
    env_file:
      - .env

    environment:
      - NODE_ENV=production

    # ВАЖНО: слушаем ТОЛЬКО 127.0.0.1. Снаружи игра доступна исключительно
    # через Caddy/nginx с HTTPS. Если убрать "127.0.0.1:", порт 3000 откроется
    # в интернет — этого делать не надо (нет TLS, нет защиты, лишняя дыра).
    # ${PORT:-3000} подставляется из .env: поменял порт в одном месте — и всё.
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"

    # Состояние игры и база карт живут на хосте и переживают
    # пересборку образа, обновление и перезапуск контейнера.
    volumes:
      - ./data:/app/data

    # --- Лимиты ресурсов (docker compose, НЕ swarm) -------------------------
    # 256 МБ хватает с запасом: внутри Node ограничен --max-old-space-size=192.
    mem_limit: 256m
    # Запрет уползать в swap: иначе при утечке сервер начнёт свопиться
    # и утянет за собой сайт и бота.
    memswap_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 128
    # Если когда-нибудь поедем в Docker Swarm — эти же лимиты задаются иначе:
    #   deploy:
    #     resources:
    #       limits:   { cpus: "0.50", memory: 256M }
    #       reservations: { memory: 128M }
    # В обычном `docker compose up` секция deploy ИГНОРИРУЕТСЯ, поэтому
    # рабочие лимиты — те, что выше (mem_limit/cpus).

    # --- Логи ---------------------------------------------------------------
    # Без этого json-файл логов растёт бесконечно и однажды забьёт 10 ГБ диска.
    # Итог: максимум 30 МБ на контейнер.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Проверка живости описана в Dockerfile (HEALTHCHECK → /health).
    # Посмотреть состояние: docker inspect --format '{{.State.Health.Status}}' evil-cards
